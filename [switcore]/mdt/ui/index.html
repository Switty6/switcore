<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDT SwitCore</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- ==================== MDT PANEL ==================== -->
<div id="mdt-panel" class="hidden">
    <div class="mdt-header">
        <div class="mdt-header-left">
            <span class="mdt-badge" id="mdt-badge">POL</span>
            <span class="mdt-title" id="mdt-title">MDT - Politie</span>
        </div>
        <button class="mdt-close" onclick="postNUI('closeMDT')"><i data-lucide="x"></i></button>
    </div>

    <div class="mdt-tabs" id="mdt-tabs"></div>

    <div class="tab-body" id="tab-body"></div>
</div>

<!-- ==================== MODALS ==================== -->

<!-- Warrant Modal -->
<div id="warrant-modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span data-i18n="mdt.modal.warrant_title">Emite Mandat</span>
            <button onclick="hideModal('warrant-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label data-i18n="mdt.modal.search_suspect">Cautare Suspect</label>
            <input type="text" id="warrant-search" placeholder="Prenume sau Nume..." data-i18n-placeholder="mdt.modal.ph_name_search" oninput="onModalSearch('warrant')" />
            <div id="warrant-search-results" class="compact-results"></div>
            <input type="hidden" id="warrant-char-id" />
            <div id="warrant-char-display" class="selected-char hidden"></div>
            <label data-i18n="mdt.modal.label_charges">Acuzatii</label>
            <textarea id="warrant-charges" rows="3" placeholder="Acuzatii..." data-i18n-placeholder="mdt.modal.ph_charges"></textarea>
            <label data-i18n="mdt.modal.label_bail">Cautiune ($)</label>
            <input type="number" id="warrant-bail" value="0" min="0" />
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="hideModal('warrant-modal')" data-i18n="mdt.modal.cancel">Anuleaza</button>
            <button class="btn-primary" onclick="submitWarrant()" data-i18n="mdt.modal.emit">Emite</button>
        </div>
    </div>
</div>

<!-- Citation Modal -->
<div id="citation-modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span data-i18n="mdt.modal.citation_title">Emite Citatie</span>
            <button onclick="hideModal('citation-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label data-i18n="mdt.modal.search_suspect">Cautare Suspect</label>
            <input type="text" id="citation-search" placeholder="Prenume sau Nume..." data-i18n-placeholder="mdt.modal.ph_name_search" oninput="onModalSearch('citation')" />
            <div id="citation-search-results" class="compact-results"></div>
            <input type="hidden" id="citation-char-id" />
            <div id="citation-char-display" class="selected-char hidden"></div>
            <label data-i18n="mdt.modal.label_offense">Infractiune</label>
            <input type="text" id="citation-offense" placeholder="Ex: Depasire viteza..." data-i18n-placeholder="mdt.modal.ph_offense" />
            <label data-i18n="mdt.modal.label_fine">Amenda ($)</label>
            <input type="number" id="citation-fine" value="500" min="0" />
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="hideModal('citation-modal')" data-i18n="mdt.modal.cancel">Anuleaza</button>
            <button class="btn-primary" onclick="submitCitation()" data-i18n="mdt.modal.emit">Emite</button>
        </div>
    </div>
</div>

<!-- BOLO Modal -->
<div id="bolo-modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span data-i18n="mdt.modal.bolo_title">Emite BOLO</span>
            <button onclick="hideModal('bolo-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label data-i18n="mdt.modal.label_subject">Subiect / Nume Suspect</label>
            <input type="text" id="bolo-subject" placeholder="Nume sau Neidentificat..." data-i18n-placeholder="mdt.modal.ph_subject" />
            <label data-i18n="mdt.modal.label_description">Descriere</label>
            <textarea id="bolo-description" rows="3" placeholder="Descriere suspect, comportament..." data-i18n-placeholder="mdt.modal.ph_bolo_description"></textarea>
            <label data-i18n="mdt.modal.label_vehicle_info">Informatii Vehicul (optional)</label>
            <input type="text" id="bolo-vehicle" placeholder="Marca, model, culoare, numar..." data-i18n-placeholder="mdt.modal.ph_vehicle_info" />
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="hideModal('bolo-modal')" data-i18n="mdt.modal.cancel">Anuleaza</button>
            <button class="btn-primary" onclick="submitBOLO()" data-i18n="mdt.modal.emit">Emite</button>
        </div>
    </div>
</div>

<!-- Incident Modal -->
<div id="incident-modal" class="modal hidden">
    <div class="modal-box modal-box-wide">
        <div class="modal-header">
            <span data-i18n="mdt.modal.incident_title">Raport Incident</span>
            <button onclick="hideModal('incident-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label data-i18n="mdt.modal.label_title">Titlu</label>
            <input type="text" id="incident-title" placeholder="Titlu incident..." data-i18n-placeholder="mdt.modal.ph_title" />
            <label data-i18n="mdt.modal.label_description">Descriere</label>
            <textarea id="incident-desc" rows="4" placeholder="Descriere detaliata..." data-i18n-placeholder="mdt.modal.ph_incident_desc"></textarea>
            <label data-i18n="mdt.modal.label_involved">Persoane implicate (ID-uri separate prin virgula)</label>
            <input type="text" id="incident-involved" placeholder="Ex: 12, 45, 78" data-i18n-placeholder="mdt.modal.ph_involved" />
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="hideModal('incident-modal')" data-i18n="mdt.modal.cancel">Anuleaza</button>
            <button class="btn-primary" onclick="submitIncident()" data-i18n="mdt.modal.save">Salveaza</button>
        </div>
    </div>
</div>

<!-- Impound Modal -->
<div id="impound-modal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span data-i18n="mdt.modal.impound_title">Sechestru Vehicul</span>
            <button onclick="hideModal('impound-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label data-i18n="mdt.modal.label_plate">Numar Inmatriculare</label>
            <input type="text" id="impound-plate" placeholder="Ex: AB12 CDE" data-i18n-placeholder="mdt.modal.ph_plate" style="text-transform:uppercase" />
            <label data-i18n="mdt.modal.label_model">Model Vehicul</label>
            <input type="text" id="impound-model" placeholder="Ex: Adder, Sultan..." data-i18n-placeholder="mdt.modal.ph_model" />
            <label data-i18n="mdt.modal.label_reason">Motiv Sechestru</label>
            <textarea id="impound-reason" rows="2" placeholder="Motivul sechestrului..." data-i18n-placeholder="mdt.modal.ph_reason"></textarea>
            <label data-i18n="mdt.modal.label_fee">Taxa Recuperare ($)</label>
            <input type="number" id="impound-fee" value="2500" min="0" />
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="hideModal('impound-modal')" data-i18n="mdt.modal.cancel">Anuleaza</button>
            <button class="btn-primary" onclick="submitImpound()" data-i18n="mdt.modal.impound">Sechestru</button>
        </div>
    </div>
</div>

<script src="nui://core/ui/i18n.js"></script>
<script src="script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons();
    });
</script>
</body>
</html>
