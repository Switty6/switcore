<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwitCore Admin - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="dashboard-page">

<aside class="sidebar">
    <div class="sidebar-header">
        <img class="hex-logo hex-logo--sm" src="logo.svg" alt="SwitCore Logo" />
        <div>
            <div class="sidebar-title">SwitCore</div>
            <div class="sidebar-subtitle">Admin Panel</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Panou</div>
        <ul class="group-list" style="margin-bottom:12px">
            <li>
                <a href="dashboard.html" class="group-btn active" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="settings"></i></span>
                    <span class="group-name">Setări</span>
                </a>
            </li>
            <li>
                <a href="players.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="users"></i></span>
                    <span class="group-name">Jucători</span>
                </a>
            </li>
            <li>
                <a href="users.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="key"></i></span>
                    <span class="group-name">Utilizatori Panel</span>
                </a>
            </li>
            <li>
                <a href="audit.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="clipboard-list"></i></span>
                    <span class="group-name">Audit Log</span>
                </a>
            </li>
            <li>
                <a href="jobs.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="briefcase"></i></span>
                    <span class="group-name">Joburi</span>
                </a>
            </li>
            <li>
                <a href="docs.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="book"></i></span>
                    <span class="group-name">Documentație</span>
                </a>
            </li>
        </ul>

        <div class="nav-section-label">Setări</div>
        <ul id="group-list" class="group-list">
            <li>
                <button class="group-btn active" data-group="all">
                    <span class="group-icon">⬡</span>
                    <span class="group-name">Toate</span>
                    <span class="group-badge" id="badge-all">-</span>
                </button>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-details">
                <div class="user-name" id="user-name">Admin</div>
                <div class="user-role" id="user-role-label">Administrator</div>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Deconectare">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </div>
</aside>

<main class="main">

    <header class="main-header">
        <div class="breadcrumb">
            <span class="breadcrumb-root">Setări</span>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current" id="breadcrumb-current">Toate</span>
        </div>

        <div class="header-actions">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="search" class="search-input" placeholder="Caută cheie sau descriere…">
                <button class="search-clear hidden" id="search-clear"><i data-lucide="x"></i></button>
            </div>

            <button class="btn-save hidden" id="btn-save-all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Salvează modificările
                <span class="save-badge" id="save-count">0</span>
            </button>

            <button class="btn-reload" id="btn-reload" title="Reîncarcă din DB">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="stat-total">-</span>
            <span class="stat-label">setări totale</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-value" id="stat-modified">0</span>
            <span class="stat-label">modificate</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-value" id="stat-groups">-</span>
            <span class="stat-label">grupuri</span>
        </div>
    </div>

    <div class="table-wrap">
        <table class="settings-table">
            <thead>
                <tr>
                    <th class="col-key">Cheie</th>
                    <th class="col-value">Valoare</th>
                    <th class="col-desc">Descriere</th>
                    <th class="col-action"></th>
                </tr>
            </thead>
            <tbody id="settings-tbody">
                <tr class="loading-row">
                    <td colspan="4">
                        <div class="loading-state">
                            <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            </svg>
                            Se încarcă setările…
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state hidden" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Nicio setare găsită pentru <strong id="empty-query"></strong></p>
    </div>
</main>

<div class="toast-container" id="toast-container"></div>

<script src="app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
