<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwitCore - Documentație</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="dashboard-page">

<aside class="sidebar">
    <div class="sidebar-header">
        <img class="hex-logo hex-logo--sm" src="logo.svg" alt="SwitCore Logo" />
        <div>
            <div class="sidebar-title">SwitCore</div>
            <div class="sidebar-subtitle">Documentație</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Panou</div>
        <ul class="group-list" style="margin-bottom:12px">
            <li>
                <a href="dashboard.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="settings"></i></span>
                    <span class="group-name">Setări</span>
                </a>
            </li>
            <li>
                <a href="players.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="users"></i></span>
                    <span class="group-name">Jucători</span>
                </a>
            </li>
            <li>
                <a href="users.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="key"></i></span>
                    <span class="group-name">Utilizatori Panel</span>
                </a>
            </li>
            <li>
                <a href="audit.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="clipboard-list"></i></span>
                    <span class="group-name">Audit Log</span>
                </a>
            </li>
            <li>
                <a href="jobs.html" class="group-btn" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="briefcase"></i></span>
                    <span class="group-name">Joburi</span>
                </a>
            </li>
            <li>
                <a href="docs.html" class="group-btn active" style="text-decoration:none">
                    <span class="group-icon"><i data-lucide="book"></i></span>
                    <span class="group-name">Documentație</span>
                </a>
            </li>
        </ul>

        <div class="nav-section-label">Module</div>
        <ul class="group-list" id="doc-nav"></ul>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-details">
                <div class="user-name" id="user-name">Admin</div>
                <div class="user-role">Administrator</div>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Deconectare">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </div>
</aside>

<main class="main">

    <header class="main-header">
        <div class="breadcrumb">
            <span class="breadcrumb-root">Documentație</span>
            <span class="breadcrumb-sep">›</span>
            <span class="breadcrumb-current" id="breadcrumb-current">Arhitectură</span>
        </div>

        <div class="header-actions">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="doc-search" class="search-input" placeholder="Caută în documentație…">
                <button class="search-clear hidden" id="search-clear"><i data-lucide="x"></i></button>
            </div>
        </div>
    </header>

    <div class="docs-content" id="doc-content">
        <!-- rendered by docs.js -->
    </div>
</main>

<script src="docs.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
